[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "email-validator>=2.2.0",
    "fastapi>=0.128.8",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.2.13",
    "pydantic-settings>=2.11.0",
    "pyjwt>=2.9.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.39.0",
]

[tool.uv.workspace]
members = [
    "backend",
]
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]
